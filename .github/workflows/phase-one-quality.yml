name: HATAALII Intelligence Runtime Quality

on:
  push:
    branches:
      - feature/hataalii-phase2-embedded-tool-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Execution node safety tests
        run: npm run test:execution-node

      - name: Browser and application tests
        run: npm run test:run

      - name: Build web application
        run: npx tsc -b && npx vite build
